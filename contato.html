
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            color: #243247;
            line-height: 1.7;
        }

        nav {
            background: #102d4b;
            padding: 16px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin: 0 12px;
            display: inline-block;
            transition: 0.3s;
        }

        nav a:hover {
            color: #60e0c4;
        }

        .mensagem-contato {
            max-width: 1100px;
            margin: 30px auto;
            padding: 22px;
            background: #e6f7f4;
            border-left: 5px solid #149b83;
            border-radius: 8px;
            text-align: center;
            color: #102d4b;
            font-size: 19px;
            font-weight: bold;
            box-shadow: 0 4px 14px #00000010;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 9999;
        }

        .modal-conteudo {
            background: white;
            padding: 30px;
            width: 350px;
            max-width: 85%;
            border-radius: 12px;
            text-align: center;
        }

        .modal-conteudo h2 {
            color: #116b87;
            margin-bottom: 12px;
        }

        .modal-conteudo p {
            color: #666;
            font-size: 14px;
            margin-bottom: 12px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;

            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;

            border: none;
            border-radius: 6px;

            background: #198754;
            color: white;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #146c43;
        }

        #whatsapp {
            display: none;
        }

        #whatsapp a {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            transition: 0.3s;
        }

        #whatsapp a:hover {
            transform: scale(1.1);
        }

        #whatsapp svg {
            width: 75px;
            height: 75px;
        }

        @media (max-width: 600px) {

            nav a {
                margin: 7px;
                font-size: 14px;
            }

            .mensagem-contato {
                margin: 20px;
                font-size: 16px;
            }

            .modal-conteudo {
                padding: 22px;
            }

            #whatsapp a {
                bottom: 20px;
                right: 20px;
            }

            #whatsapp svg {
                width: 65px;
                height: 65px;
            }

        }

    </style>

</head>

<body>

    <nav aria-label="Menu principal">

        <a href="index.html">Home</a>
        <a href="produto.html">Produtos</a>
        <a href="contato.html">Contato</a>
        <a href="sobrenos.html">Sobre</a>

    </nav>



    <div class="mensagem-contato">

        Bem-vindo, entre em contato conosco caso queira fazer uma encomenda. "Este site é 100% fictício. Os produtos oferecidos são apenas para fins de demonstração e não estão disponíveis para compra."

    </div>

    <div class="modal" id="modalContato">

        <div class="modal-conteudo">

            <h2>Identifique-se</h2>

            <p>
                Para entrar em contato conosco,
                informe seus dados abaixo.
            </p>

            <form id="formContato">

                <input
                    type="text"
                    id="nome"
                    placeholder="Nome completo"
                    required
                >

                <input
                    type="tel"
                    id="telefone"
                    placeholder="Número de telefone"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="E-mail (opcional)"
                >

                <input
                    type="password"
                    id="senha"
                    placeholder="Senha (opcional)"
                >

                <button type="submit">
                    CONTINUAR
                </button>

            </form>

        </div>

    </div>

    <div id="whatsapp">

        <a href="https://wa.me/558386401817"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Entre em contato pelo WhatsApp">

            <svg
                enable-background="new 0 0 512 512"
                width="90"
                height="90"
                version="1.1"
                viewBox="0 0 512 512"
                xmlns="http://www.w3.org/2000/svg">

                <path
                    d="M256.064,0h-0.128l0,0C114.784,0,0,114.816,0,256c0,56,18.048,107.904,48.736,150.048l-31.904,95.104  l98.4-31.456C155.712,496.512,204,512,256.064,512C397.216,512,512,397.152,512,256S397.216,0,256.064,0z"
                    fill="#4CAF50"/>

                <path
                    d="m405.02 361.5c-6.176 17.44-30.688 31.904-50.24 36.128-13.376 2.848-30.848 5.12-89.664-19.264-75.232-31.168-123.68-107.62-127.46-112.58-3.616-4.96-30.4-40.48-30.4-77.216s18.656-54.624 26.176-62.304c6.176-6.304 16.384-9.184 26.176-9.184 3.168 0 6.016 0.16 8.576 0.288 7.52 0.32 11.296 0.768 16.256 12.64 6.176 14.88 21.216 51.616 23.008 55.392 1.824 3.776 3.648 8.896 1.088 13.856-2.4 5.12-4.512 7.392-8.288 11.744s-7.36 7.68-11.136 12.352c-3.456 4.064-7.36 8.416-3.008 15.936 4.352 7.36 19.392 31.904 41.536 51.616 28.576 25.44 51.744 33.568 60.032 37.024 6.176 2.56 13.536 1.952 18.048-2.848 5.728-6.176 12.8-16.416 20-26.496 5.12-7.232 11.584-8.128 18.368-5.568 6.912 2.4 43.488 20.48 51.008 24.224 7.52 3.776 12.48 5.568 14.304 8.736 1.792 3.168 1.792 18.048-4.384 35.52z"
                    fill="#FAFAFA"/>

            </svg>

        </a>

    </div>

    <script>

        const formulario = document.getElementById("formContato");

        formulario.addEventListener("submit", function(event) {

            event.preventDefault();

            const nome = document.getElementById("nome").value.trim();

            const telefone = document.getElementById("telefone").value.trim();

            if (nome === "" || telefone === "") {

                alert("Preencha seu nome e telefone!");

                return;

            }

            document.getElementById("modalContato").style.display = "none";

            document.getElementById("whatsapp").style.display = "block";

            alert("Identificação realizada com sucesso!");

        });

    </script>

</body>

</html>
